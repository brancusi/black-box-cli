<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Box tutorial</title>
<link rel="icon" href="data:,">
<!-- Written by `blackbox tutorial --open` from black_box_cli/tutorial_page.html and the tutorial's data (the lessons,
     every command, what's new). Every name, clip and line in it is invented. -->
<style>
/* Walkabout's tokens (brancusi/walkabout, viewer/src/styles.js), square-cornered. Nothing loads from the network:
   Geist Mono and Archivo are used when installed, else the Mac's own mono. */
:root {
  --ground: #f2efe8; --surface: #fbfaf6; --sunken: #e8e4da; --ink: #161616; --muted: #5d5a54; --faint: #807b70;
  --line: #dcd6ca; --line-strong: #86806f; --green: #24453a; --mustard: #d4a12a; --mustard-deep: #7d5a08; --mustard-tint: #f3e3b5;
  --danger: #a12b22; color-scheme: light;
  --video: #0e0e0d; --video-fg: #e8e3d9; --video-dim: #9a948a; --video-line: #3a3731;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --brand: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --c-start: #b39ddb; --c-find: #d9a933; --c-cut: #86bfa3; --c-resolve: #e07a6a; --c-stills: #7fb0d0; --c-new: #e88fb6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #121110; --surface: #1a1917; --sunken: #0d0c0b; --ink: #efebe3; --muted: #a9a398; --faint: #858076;
  --line: #2c2a26; --line-strong: #6d675b; --green: #86bfa3; --mustard: #d9a933; --mustard-deep: #d9a933; --mustard-tint: #4a3a12;
  --danger: #ee8a7c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #121110; --surface: #1a1917; --sunken: #0d0c0b; --ink: #efebe3; --muted: #a9a398; --faint: #858076;
  --line: #2c2a26; --line-strong: #6d675b; --green: #86bfa3; --mustard: #d9a933; --mustard-deep: #d9a933; --mustard-tint: #4a3a12;
  --danger: #ee8a7c; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 400 13px/20px var(--mono); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:where(button, input, [tabindex]):focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border: 1px solid var(--line-strong); font: 11px/1 var(--mono); color: var(--muted); vertical-align: 1px; }

/* ---------- page */
.top { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; font: 800 17px/1 var(--brand); letter-spacing: -.04em; }
.logo i { width: 14px; height: 14px; background: var(--ink); display: block; box-shadow: 4px 4px 0 var(--mustard); }
.top .ver { color: var(--faint); }
.top .grow { flex: 1; }
.theme { height: 28px; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 0 10px; }
.theme:hover { color: var(--ink); border-color: var(--line-strong); }
.caption { min-height: 40px; color: var(--muted); font-size: 14px; line-height: 20px; border-left: 2px solid var(--mustard); padding: 0 0 0 10px; }
.caption:empty { border-left-color: transparent; }
.start { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(14,14,13,.55); }
.start button { height: 56px; padding: 0 26px; border: 0; background: var(--video-fg); color: var(--video); font: 600 16px var(--mono); display: inline-flex; gap: 12px; align-items: center; }
.start button:hover { background: #fff; }
.start small { display: block; color: var(--video-dim); margin-top: 10px; text-align: center; }
.newpill { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 1px solid var(--mustard); background: transparent; color: var(--mustard-deep); font-weight: 500; }
.newpill::before { content: ""; width: 6px; height: 6px; background: var(--mustard); animation: blinkdot 1.6s steps(1) infinite; }
.newpill:hover { background: var(--mustard); color: #1a1408; }
@keyframes blinkdot { 50% { opacity: .2; } }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 30vw, 460px); height: calc(100vh - 48px); }
@media (max-width: 1100px) { .layout { grid-template-columns: 1fr; height: auto; } .side { border-left: 0; border-top: 1px solid var(--line); } }

/* ---------- player */
.player { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: auto; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--video); border: 1px solid var(--line); cursor: pointer; }
.stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; }
.paused-mark { position: absolute; inset: 0; display: none; place-items: center; background: rgba(14,14,13,.35); z-index: 50; }
.paused-mark span { width: 72px; height: 72px; background: var(--video-fg); display: grid; place-items: center; color: var(--video); font-size: 26px; padding-left: 5px; }
.screen.paused .paused-mark { display: grid; }
.chapters { display: flex; gap: 3px; height: 22px; align-items: center; }
.chapters .ch { position: relative; height: 4px; background: var(--line); flex: 1; cursor: pointer; transition: height .12s; }
.chapters .ch:hover { height: 8px; }
.chapters .ch .fill { position: absolute; inset: 0; width: 0; background: var(--c, var(--ink)); }
.chapters .ch .tip { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--ground); padding: 2px 8px; font-size: 12px; opacity: 0; pointer-events: none; z-index: 5; }
.chapters .ch:hover .tip { opacity: 1; }
.controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.controls button { height: 28px; background: transparent; border: 1px solid var(--line); padding: 0 10px; color: var(--muted); }
.controls button:hover { color: var(--ink); border-color: var(--line-strong); }
.controls .play { width: 40px; color: var(--ink); }
.controls .time { color: var(--faint); margin: 0 6px; }
.controls .now { color: var(--ink); font-weight: 600; }
.controls .grow { flex: 1; }
.seg { display: inline-flex; }
.seg button { margin-left: -1px; }
.seg button.on { background: var(--ink); color: var(--ground); border-color: var(--ink); position: relative; }
.hint { color: var(--faint); font-size: 12px; }

/* ---------- side panel */
.side { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; height: 44px; background: none; border: 0; color: var(--faint); border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--mustard); }
.tabs .count { color: var(--faint); font-weight: 400; margin-left: 6px; }
.pane { overflow-y: auto; padding: 14px 16px 40px; display: none; flex: 1; }
.pane.on { display: block; }
.wf { margin-bottom: 18px; }
.wf h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 500 12px/20px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
.wf h3::before { content: ""; width: 8px; height: 8px; background: var(--c); }
.wf h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.wf .blurb { color: var(--faint); font-size: 12px; margin: 0 0 8px 16px; }
.lesson { border: 1px solid var(--line); background: var(--ground); margin-bottom: -1px; position: relative; }
.lesson.cur { border-color: var(--line-strong); box-shadow: inset 3px 0 0 var(--c); z-index: 1; }
.lesson .head { display: flex; gap: 10px; align-items: center; padding: 8px 12px; cursor: pointer; }
.lesson .head:hover { background: var(--sunken); }
.lesson .head .t { font-weight: 600; flex: 1; }
.lesson .head .p { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.lesson .head .go { color: var(--faint); font-size: 12px; white-space: nowrap; border: 1px solid var(--line); padding: 0 6px; }
.lesson .head .go:hover { color: var(--ink); border-color: var(--line-strong); }
.lesson .body { display: none; padding: 0 12px 12px; border-top: 1px solid var(--line); }
.lesson.open .body { display: block; }
.body h4 { margin: 12px 0 6px; font: 500 11px/18px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.body .what { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.say { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); padding: 6px 10px; margin-bottom: 4px; font-size: 12.5px; color: var(--ink); }
.say:hover { border-color: var(--line-strong); border-left-color: var(--green); }
.cmd { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
.cmd code { font: 12px/18px var(--mono); background: var(--video); color: var(--video-fg); padding: 6px 8px; display: block; white-space: pre-wrap; word-break: break-word; flex: 1; }
.cmd code::before { content: "$ "; color: var(--mustard); }
.cmd .d { display: block; color: var(--video-dim); font-size: 11.5px; margin-top: 2px; }
.cmd .d::before { content: "# "; }
.copy { height: 24px; background: none; border: 1px solid var(--line); padding: 0 7px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.copy:hover { color: var(--ink); border-color: var(--line-strong); }
.copy.done { color: var(--green); border-color: var(--green); }
.tips { padding-left: 16px; margin: 0; }
.tips li { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.badge { font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .06em; color: #1a1408; background: var(--mustard); padding: 0 4px; vertical-align: 1px; }
.filter { width: 100%; height: 32px; background: var(--ground); border: 1px solid var(--line); color: var(--ink); padding: 0 10px; margin-bottom: 8px; }
.filter:focus { border-color: var(--line-strong); outline: none; }
.command { border-bottom: 1px solid var(--line); padding: 10px 0; }
.command .u { font-weight: 600; }
.command .s { color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
.command details summary { color: var(--faint); font-size: 12px; cursor: pointer; }
.command dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0; font-size: 12px; }
.command dt { color: var(--ink); white-space: nowrap; }
.command dd { margin: 0; color: var(--muted); }
.command .see { background: none; border: 0; color: var(--mustard-deep); padding: 0; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.ver-block { margin-bottom: 20px; }
.ver-block h3 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; font: 800 18px/22px var(--brand); letter-spacing: -.03em; }
.ver-block h3 small { color: var(--faint); font: 400 12px var(--mono); letter-spacing: 0; }
.news { background: var(--ground); border: 1px solid var(--line); padding: 10px 12px; margin-bottom: -1px; }
.news.latest { box-shadow: inset 3px 0 0 var(--mustard); }
.news b { display: block; }
.news p { margin: 2px 0 8px; color: var(--muted); font-size: 12.5px; }
.news .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.news code { font: 12px var(--mono); color: var(--faint); flex: 1; }
.news .show { height: 24px; background: none; border: 1px solid var(--line); padding: 0 8px; font-size: 12px; color: var(--muted); }
.news .show:hover { color: var(--ink); border-color: var(--line-strong); }
.playnew { width: 100%; height: 36px; background: var(--mustard); color: #1a1408; border: 0; font-weight: 600; margin-bottom: 16px; }

/* ---------- the stage: everything at 1280 x 720 */
.stage { font-family: var(--mono); color: var(--video-fg); background: var(--video); }
.stage .bgglow { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(140px); opacity: .14; background: var(--c); left: 600px; top: -300px; }
.stage .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; }
.x { position: absolute; }
/* appear: .a hides, .in shows; the variant sets where it comes from */
.a { opacity: 0; transition: opacity .3s ease, transform .5s cubic-bezier(.2,1.35,.4,1), filter .4s; }
.a.up { transform: translateY(26px); } .a.down { transform: translateY(-26px); } .a.left { transform: translateX(-40px); } .a.right { transform: translateX(40px); }
.a.pop { transform: scale(.4); } .a.slam { transform: scale(2.3); filter: blur(6px); } .a.zoom { transform: scale(.85); }
.a.in { opacity: 1; transform: none; filter: none; }
.tag { left: 60px; top: 40px; font: 500 15px var(--mono); letter-spacing: .14em; color: var(--c); text-transform: uppercase; }
.tag b { color: rgba(255,255,255,.45); font-weight: 500; }
.bigtitle { left: 0; top: 270px; width: 1280px; text-align: center; font: 800 88px/1.02 var(--brand); letter-spacing: -.045em; line-height: 1.02; padding: 0 80px; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
.bigtitle.gone { opacity: 0 !important; transform: scale(.7) translateY(-160px) !important; transition: opacity .35s, transform .45s ease-in; }
.smalltitle { left: 60px; top: 66px; font: 800 40px/1.1 var(--brand); letter-spacing: -.04em; max-width: 1160px; }
.bubble { left: 60px; width: 500px; padding: 14px 18px; font-size: 20px; line-height: 1.35; }
.bubble .who { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .55; margin-bottom: 4px; }
.you { top: 150px; background: #efebe3; color: #161616; border-left: 6px solid var(--c); }
.agent { top: 300px; background: #0b0a09; border: 1px solid #3a3731; padding: 12px 16px; }
.term { font: 15.5px/1.6 var(--mono); }
.term .ln { min-height: 24px; white-space: pre-wrap; word-break: break-all; }
.term .ln .p { color: var(--c); }
.term .ln .c { color: #6b7280; }
.term .ok { color: #34d399; }
.typing::after { content: "▍"; color: #fff; animation: blink .5s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.punch { left: 60px; top: 612px; width: 1160px; font: 800 36px/1.15 var(--brand); letter-spacing: -.035em; }
.punch u { text-decoration: none; background: linear-gradient(transparent 62%, var(--c) 62%, var(--c) 90%, transparent 90%); background-size: 0% 100%; background-repeat: no-repeat; transition: background-size .7s .25s ease; }
.punch.in u { background-size: 100% 100%; }
.newflag { right: 40px; top: 34px; background: var(--c-new); color: #1a0b14; font-weight: 600; letter-spacing: .12em; padding: 4px 12px; font-size: 16px; transform: rotate(3deg); }
.newflag.a.in { transform: rotate(3deg); }
.canvas { left: 610px; top: 140px; width: 620px; height: 450px; background: rgba(26,25,23,.92); border: 1px solid #3a3731; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.chip { background: #1a1917; border: 1px solid #4a463e; padding: 5px 12px; font: 15px var(--mono); white-space: nowrap; }
.chip.hl { border-color: var(--c); color: var(--c); }
.card { background: #1a1917; border: 1px solid #3a3731; }
.lbl { font: 600 12px var(--mono); letter-spacing: .08em; color: rgba(255,255,255,.6); }
.dotb { width: 12px; height: 12px; border-radius: 50%; left: 0; top: 0; }
.dotb.a { transform: translate(0,0) scale(.3); transition: transform .8s cubic-bezier(.1,.8,.3,1), opacity 1.1s ease-in; }
.dotb.a.in { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
.dotb.a.in.fresh { opacity: 1; }
.art { overflow: hidden; }
.art svg { display: block; width: 100%; height: 100%; }
.dim { opacity: .25 !important; filter: grayscale(.8) !important; transition: opacity .4s, filter .4s; }
.glowon { box-shadow: 0 0 0 3px var(--c), 0 0 30px var(--c); transition: box-shadow .35s; }
.score { font: 600 13px var(--mono); background: var(--c); color: #111; padding: 1px 6px; }
.keycap { width: 64px; height: 64px; background: #efebe3; color: #111; font: 600 28px var(--mono); border: 2px solid #161616; display: grid; place-items: center; box-shadow: 0 6px 0 #9ca3af, 0 12px 30px rgba(0,0,0,.5); }
.keycap.press { transform: translateY(5px) !important; box-shadow: 0 1px 0 #9ca3af, 0 6px 20px rgba(0,0,0,.5); }
.toast { background: #efebe3; color: #161616; border-left: 4px solid var(--c); padding: 10px 14px; font-size: 15px; }
.toast .ok { color: #24453a; font-weight: 700; }
.wave i { display: inline-block; width: 4px; margin-right: 3px; background: var(--c); vertical-align: middle; }
.clip { overflow: hidden; border: 2px solid #4a463e; transition: left .55s cubic-bezier(.3,1.2,.4,1), top .55s cubic-bezier(.3,1.2,.4,1), width .4s, border-color .3s, box-shadow .3s; }
.clip .cap { position: absolute; left: 0; bottom: 0; right: 0; font: 700 10.5px var(--mono); padding: 2px 5px; background: rgba(0,0,0,.65); }
.clip.orig { border-color: #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,.45); }
.handle { background: repeating-linear-gradient(45deg, rgba(224,122,106,.55) 0 6px, rgba(224,122,106,.12) 6px 12px); }
.track { background: #0b0a09; border: 1px solid #3a3731; }
.flash { inset: 0; background: #fff; }
.flash.a { transition: opacity .08s; }
.cursor { width: 26px; height: 26px; z-index: 9; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
.ring { border: 2px solid var(--c); }
.ring.a { transform: scale(.2); transition: transform .9s cubic-bezier(.1,.8,.3,1), opacity 1s ease-in; }
.ring.a.in { transform: scale(1); opacity: 0; }
.ring.a.in.fresh { opacity: 1; }
.float { font-size: 18px; background: #efebe3; color: #161616; border-left: 5px solid var(--fc, var(--c)); padding: 10px 14px; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.logo-big { left: 0; width: 1280px; top: 230px; text-align: center; font: 800 160px/1 var(--brand); letter-spacing: -.06em; }
.logo-big span { display: inline-block; }
.flashword { left: 0; width: 1280px; top: 450px; text-align: center; font: 500 56px/1.1 var(--mono); letter-spacing: -.02em; }
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i></i>Black Box</div>
  <span class="ver" id="ver"></span>
  <span class="grow"></span>
  <button class="theme" id="theme" title="Light, dark, or as the Mac is set"></button>
  <button class="newpill" id="newpill"></button>
</header>
<div class="layout">
  <section class="player">
    <div class="screen" id="screen"><div class="stage" id="stage"></div><div class="paused-mark"><span>▶</span></div>
      <div class="start" id="start"><div><button id="startbtn">▶ Start the tutorial</button><small>about two minutes, with narration</small></div></div></div>
    <div class="caption" id="caption"></div>
    <div class="chapters" id="chapters"></div>
    <div class="controls">
      <button id="prev" title="Previous (←)">⏮</button>
      <button class="play" id="play" title="Play or pause (space)">❚❚</button>
      <button id="next" title="Next (→)">⏭</button>
      <button id="mute" title="Sound on or off (m)">🔊 sound</button>
      <span class="time"><span class="now" id="now"></span> · <span id="clock"></span></span>
      <span class="grow"></span>
      <span class="seg" id="modes"><button data-mode="all" class="on">Everything</button><button data-mode="new">What's new</button></span>
      <span class="seg" id="speeds"><button data-s="1" class="on">1×</button><button data-s="1.5">1.5×</button><button data-s="2">2×</button></span>
    </div>
    <div class="hint"><kbd>space</kbd> play or pause · <kbd>←</kbd> <kbd>→</kbd> previous or next · <kbd>m</kbd> sound · <kbd>n</kbd> what's new · click a lesson on the right to jump there. You never type these commands: say what you want, and your agent runs them.</div>
  </section>
  <aside class="side">
    <nav class="tabs" id="tabs">
      <button data-tab="wf" class="on">Workflows</button>
      <button data-tab="cmds">Commands<span class="count" id="ncmds"></span></button>
      <button data-tab="new">What's new</button>
    </nav>
    <div class="pane on" id="pane-wf"></div>
    <div class="pane" id="pane-cmds"><input class="filter" id="filter" placeholder="Filter: still, resolve, person…"><div id="cmdlist"></div></div>
    <div class="pane" id="pane-new"></div>
  </aside>
</div>
<audio id="voice" preload="auto"></audio>
<script>
  // The theme first, before anything paints: auto (as the Mac is set), light or dark, remembered on this Mac.
  (function () { try { var t = localStorage.getItem("bb-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<script type="application/json" id="tutorial-data">/*TUTORIAL_DATA*/</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("tutorial-data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const LATEST = D.news[0];
  const lessonById = {}; D.lessons.forEach((l) => (lessonById[l.id] = l));

  $("filter").addEventListener("input", (e) => commands(e.target.value));
  $("cmdlist").addEventListener("click", (e) => {
    const cp = e.target.closest("[data-copy]"); if (cp) { copy(cp, cp.dataset.copy); return; }
    const s = e.target.closest("[data-lesson]"); if (s) jumpTo(s.dataset.lesson);
  });
  commands("");

  $("pane-new").innerHTML = `<button class="playnew" id="playnew">▶ Play what's new in v${esc(LATEST.version)}</button>` +
    D.news.map((v, vi) => `
      <div class="ver-block"><h3>v${esc(v.version)} <small>${v.date ? esc(v.date) : "this version"}</small></h3>
      ${v.items.map((it) => `<div class="news${vi === 0 ? " latest" : ""}"><b>${esc(it.title)}</b><p>${esc(it.what)}</p>
        <div class="row"><code>${esc(it.run)}</code><button class="show" data-lesson="${esc(it.lesson)}">▶ show me</button></div></div>`).join("")}
      </div>`).join("");
  $("pane-new").addEventListener("click", (e) => {
    if (e.target.id === "playnew") { playlist("new"); setPlaying(true); return; }
    const s = e.target.closest("[data-lesson]"); if (s) jumpTo(s.dataset.lesson);
  });
  $("ver").textContent = "tutorial · v" + D.version;
  $("newpill").textContent = `✦ What's new in v${LATEST.version}`;
  $("newpill").addEventListener("click", () => { playlist("new"); tab("new"); setPlaying(true); });

  playlist(location.hash === "#new" ? "new" : "all");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
