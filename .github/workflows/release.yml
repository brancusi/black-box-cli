name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bb test
      - run: bb lint
      - run: bb fmt
      - run: bb dist "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" target/blackbox-cli.jar target/blackbox-cli.jar.sha256 --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
